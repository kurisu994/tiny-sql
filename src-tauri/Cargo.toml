[package]
name = "tiny-sql"
version = "0.8.0-rc2"
description = "多级跳板机友好的 MySQL 桌面客户端"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# 本 crate 不直接调 reqwest：这条依赖只为给 tauri-plugin-updater 内部的 reqwest
# 打开 socks feature（Cargo 的 feature 统一），否则更新代理填 socks5:// 会在
# Proxy 解析阶段被拒。socks 实现内置于 reqwest，启用它不引入任何新 crate。
reqwest = { version = "0.13", default-features = false, features = ["socks"] }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tokio-util = { workspace = true }
log = { workspace = true }
ssh-multihop = { path = "../crates/ssh-multihop" }
db-driver = { path = "../crates/db-driver" }
# 连接配置加密 store
aes-gcm = "0.10"
base64 = "0.22"
# 用户主密码 KDF（Argon2id v19，无 default features 即可满足 hash_password_into）
argon2 = { version = "0.5", default-features = false }
# 内存密钥清零；=1.8.x 精确约束以兼容项目声明的 MSRV 1.77（1.9 起官方 MSRV 1.85）
zeroize = "=1.8.1"
uuid = { version = "1", features = ["v4"] }
# 最近使用时间戳（ISO 8601）
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# 结果集导出 Excel（FR-107）；constant_memory 支持大结果集恒定内存流式写出
rust_xlsxwriter = { version = "0.83", features = ["constant_memory"] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
# 仅测试用：更新代理的 socks5 契约测试要先装 rustls crypto provider 才能构建
# reqwest Client（插件启用了 rustls-no-provider，运行时由插件自己安装）。
# rustls 已在依赖树中（tauri-plugin-updater 的 rustls-tls），不新增 crate。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
